# Serves the built dashboard and forwards /api/* to the FastAPI service on localhost.
# Dashboard and API share one origin, so the backend needs no CORS configuration.
server {
    listen 80 default_server;
    server_name _;

    root /var/www/cloudsentry;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /api/ {
        # The trailing slash strips the /api prefix: /api/scan -> /scan
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;  # scans with AI analysis can take a few minutes
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

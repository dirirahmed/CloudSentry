AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  CloudSentry public demo: React dashboard in a private S3 bucket and the FastAPI backend
  on AWS Lambda, both behind one CloudFront HTTPS address. The scanner audits the AWS account
  this stack runs in, so deploy it only in a dedicated sandbox account. The stack also creates
  a few intentionally insecure resources, attached to nothing, so there is something to find.
  Deploy with deploy/serverless/deploy.sh.

Parameters:
  CodeBucket:
    Type: String
    Description: S3 bucket holding the Lambda package (deploy.sh creates and fills it)
  CodeKey:
    Type: String
    Description: Key of the Lambda package zip in CodeBucket
  MaxConcurrentScans:
    Type: Number
    Default: 0
    MinValue: 0
    Description: >-
      Reserved concurrency for the API function. 0 leaves it unset. New accounts with a
      concurrency quota of 10 cannot reserve any, so only set this after checking the quota.
  AlertEmail:
    Type: String
    Default: ""
    Description: Optional. Email address for a monthly cost alert. Leave empty to skip it.
  MonthlyBudgetUsd:
    Type: Number
    Default: 1
    MinValue: 1

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]
  HasConcurrencyLimit: !Not [!Equals [!Ref MaxConcurrentScans, 0]]

Resources:
  # ---------------------------------------------------------------- API (Lambda)

  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        # Same actions as docs/iam-policy.json. No Bedrock access: AI analysis is off in the demo.
        - PolicyName: CloudSentryScannerReadOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CloudSentryReadOnlyAudit
                Effect: Allow
                Action:
                  - iam:GetAccountAuthorizationDetails
                  - iam:GetAccountSummary
                  - iam:GetLoginProfile
                  - iam:ListMFADevices
                  - iam:ListAccessKeys
                  - iam:GetAccessKeyLastUsed
                  - s3:ListAllMyBuckets
                  - s3:GetAccountPublicAccessBlock
                  - s3:GetBucketPublicAccessBlock
                  - s3:GetBucketPolicyStatus
                  - s3:GetBucketAcl
                  - s3:GetEncryptionConfiguration
                  - ec2:DescribeSecurityGroups
                  - cloudtrail:DescribeTrails
                  - cloudtrail:GetTrailStatus
                Resource: "*"

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-api"
      RetentionInDays: 14

  ApiFunction:
    Type: AWS::Lambda::Function
    DependsOn: ApiLogGroup
    Properties:
      FunctionName: !Sub "${AWS::StackName}-api"
      Description: CloudSentry FastAPI backend (read-only AWS scanner)
      Runtime: python3.12
      Architectures: [x86_64]
      Handler: app.lambda_handler.handler
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      MemorySize: 512
      Timeout: 60
      Role: !GetAtt ApiRole.Arn
      ReservedConcurrentExecutions: !If [HasConcurrencyLimit, !Ref MaxConcurrentScans, !Ref "AWS::NoValue"]

  # Not public: AWS_IAM means only callers allowed below (CloudFront) can invoke it.
  ApiUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt ApiFunction.Arn
      AuthType: AWS_IAM

  CloudFrontInvokeUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt ApiFunction.Arn
      Action: lambda:InvokeFunctionUrl
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
      FunctionUrlAuthType: AWS_IAM

  CloudFrontInvokeFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt ApiFunction.Arn
      Action: lambda:InvokeFunction
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
      InvokedViaFunctionUrl: true

  # ---------------------------------------------------------------- dashboard (S3)

  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

  # Private bucket: only this CloudFront distribution can read it.
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt SiteBucket.Arn
              - !Sub "${SiteBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # ---------------------------------------------------------------- HTTPS (CloudFront)

  SiteOriginAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-site"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  ApiOriginAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-api"
        OriginAccessControlOriginType: lambda
        SigningBehavior: always
        SigningProtocol: sigv4

  SecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-security-headers"
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            ContentSecurityPolicy: "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: no-referrer
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            Override: true

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub "CloudSentry public demo (${AWS::StackName})"
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOriginAccess.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: api
            # FunctionUrl looks like https://abc123.lambda-url.<region>.on.aws/
            DomainName: !Select [2, !Split ["/", !GetAtt ApiUrl.FunctionUrl]]
            OriginAccessControlId: !GetAtt ApiOriginAccess.Id
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
              OriginReadTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          ResponseHeadersPolicyId: !Ref SecurityHeaders
          Compress: true
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
            ResponseHeadersPolicyId: !Ref SecurityHeaders

  # ---------------------------------------------------------------- demo findings
  # Intentionally insecure, attached to nothing, so they expose nothing. They exist only so
  # the scanner has something to report. Deleting the stack removes them.

  DemoVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-demo" }

  DemoWildcardAdminPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${AWS::StackName}-demo-wildcard-admin"
      Description: "CloudSentry demo: intentionally overbroad, not attached to anything"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: "*"
            Resource: "*"

  DemoPassRolePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${AWS::StackName}-demo-passrole-any"
      Description: "CloudSentry demo: intentionally overbroad, not attached to anything"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: iam:PassRole
            Resource: "*"

  DemoS3WildcardPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${AWS::StackName}-demo-s3-full-access"
      Description: "CloudSentry demo: intentionally overbroad, not attached to anything"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: s3:*
            Resource: "*"

  DemoOpenSshGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${AWS::StackName}-demo-open-ssh"
      GroupDescription: "CloudSentry demo: SSH open to the internet, attached to nothing"
      VpcId: !Ref DemoVpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 22, ToPort: 22, CidrIp: 0.0.0.0/0 }

  DemoOpenRdpGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${AWS::StackName}-demo-open-rdp"
      GroupDescription: "CloudSentry demo: RDP open to the internet, attached to nothing"
      VpcId: !Ref DemoVpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 3389, ToPort: 3389, CidrIp: 0.0.0.0/0 }

  DemoOpenDatabaseGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${AWS::StackName}-demo-open-postgres"
      GroupDescription: "CloudSentry demo: PostgreSQL open to the internet, attached to nothing"
      VpcId: !Ref DemoVpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 5432, ToPort: 5432, CidrIp: 0.0.0.0/0 }

  # Block Public Access is only partly enabled. BlockPublicPolicy stays on and ACLs are
  # disabled, so the bucket still cannot be made public.
  DemoBucket:
    Type: AWS::S3::Bucket
    Properties:
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: false

  # ---------------------------------------------------------------- cost alert

  CostBudget:
    Type: AWS::Budgets::Budget
    Condition: HasAlertEmail
    Properties:
      Budget:
        BudgetName: !Sub "${AWS::StackName}-monthly"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 1
            ThresholdType: PERCENTAGE
          Subscribers:
            - { SubscriptionType: EMAIL, Address: !Ref AlertEmail }
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - { SubscriptionType: EMAIL, Address: !Ref AlertEmail }

Outputs:
  DashboardUrl:
    Description: Public HTTPS address of the dashboard
    Value: !Sub "https://${Distribution.DomainName}"
  SiteBucket:
    Description: Bucket that holds the built dashboard
    Value: !Ref SiteBucket
  DistributionId:
    Description: CloudFront distribution ID (used for cache invalidation)
    Value: !Ref Distribution
  FunctionName:
    Description: Lambda function running the API
    Value: !Ref ApiFunction
